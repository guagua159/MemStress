name: CI

on:
  push:
    branches: [main]
    # 推 v* tag 时跑一次：校验「发布出去的二进制版本 == tag」。
    # 这是唯一真正需要版本一致性的时刻，日常提交不必为此设检查。
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_matrix:
        description: '强制跑 63 格故障注入矩阵（即使改动看起来与检测力无关）'
        type: boolean
        default: false
  # 每周一 03:00 UTC 全量跑一次。路径过滤难免有判断不到的情况，
  # 定时兜底保证检测力至少每周被完整校验一次。
  schedule:
    - cron: '0 3 * * 1'

jobs:
  build-and-selftest:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # fetch-depth: 0 拉全量历史。矩阵门控要用 git diff 比较 base 与 head，
      # 默认的浅克隆（depth=1）只含一个提交，基线在本地不存在，
      # 门控会退化成「保守全跑」——优化就永远不生效（实测踩过）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与 global.json 的 10.0.100 + latestFeature 保持一致：用 .NET 10 的最新补丁，
      # 不钉死某个小版本。钉死会让「本地能构建、CI 找不到该版本」这类问题反复出现。
      # '10.x' 与 '10.0.x' 在 setup-dotnet 里等价：两者都解析成 channel 10.0
      # （createChannelArgument → channelForMajor('10') 返回 '10.0'）。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: 构建（要求 0 错误 0 警告）
        run: dotnet build src/MemStress/MemStress.csproj -v q --nologo

      - name: 基础自检
        run: .\MemStress.exe --selftest --seconds 5 --percent 0.04 --chunk 64

      - name: 报错链路
        run: .\MemStress.exe --selftest --seconds 5 --percent 0.04 --chunk 64 --inject-error

      - name: 外部工具编排
        run: .\MemStress.exe --toolselftest

      - name: WHEA 解析链路
        run: .\MemStress.exe --wheaselftest

      # CI 里没有 tools/ 目录，工具数为 0/N 属正常，该命令恒返回 0
      - name: 工具发现
        run: .\MemStress.exe --toolscan

      - name: y-cruncher 日志解析
        run: .\MemStress.exe --yctailtest

      - name: CSV 转义与日志写失败降级
        run: .\MemStress.exe --p0test

      # 版本号只在 csproj 里存在一份，README 不再重复写死（原先靠 grep 比对
      # README 的「当前版本 X.Y」，那要求发版时手工同步两处文本，漏一处就红；
      # 而 README 里的 zip 文件名同样写死版本却无人校验，会静默过期）。
      # 真正要守的不变量是：发布出去的二进制版本 == 打的 tag。
      # 这条只在推 tag 时校验一次，日常提交不受影响。
      - name: 发布版本与 tag 一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # tag 名形如 v1.9 / v1.9.1 / v2.0，去掉 v 前缀并补足三段。
          # 先校验格式：不校验的话 v2.0-test 这类 tag 会算出 "2.0-test.0"
          # 这种无意义期望值，报错信息也就失去指向性。
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tag -notmatch '^\d+\.\d+(\.\d+)?$') {
            Write-Output "::error::tag 名「$($env:GITHUB_REF_NAME)」不是 vX.Y 或 vX.Y.Z 形式，无法与产物版本比对。"
            exit 1
          }
          $parts = @($tag -split '\.')
          while ($parts.Count -lt 3) { $parts += '0' }
          $expected = ($parts[0..2] -join '.')

          # 从产物本身读，而不是解析 csproj 文本：csproj 是 MSBuild 的输入，
          # 写法一变（加 Condition、改用 Directory.Build.props）正则就失配，
          # 而构建依然正常——那种检查只会制造误报。
          $vi = (Get-Item ./MemStress.exe).VersionInfo
          $actual = "$($vi.FileMajorPart).$($vi.FileMinorPart).$($vi.FileBuildPart)"

          Write-Output "tag=$($env:GITHUB_REF_NAME) 期望=$expected 产物=$actual"
          if ($expected -ne $actual) {
            Write-Output "::error::版本漂移：tag 是 $($env:GITHUB_REF_NAME)，但构建出的 MemStress.exe 是 $actual。发布前请先改 src/MemStress/MemStress.csproj 的 <Version>。"
            exit 1
          }
          Write-Output "版本一致"

      # 矩阵校验的是「7 种模式 × 9 种故障能否检出」——检测力的回归，约 2.3 分钟。
      # 只在可能改变这个结论的改动上跑；文档、界面、外部工具、报告排版跑它没有信息量。
      # 判断不出结果时一律保守全跑：宁可多花 2 分钟，也不能让一次真实回归
      # 因为过滤逻辑的漏洞被静默放过。
      - name: 判断是否需要跑故障注入矩阵
        id: matrix-gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          FORCE: ${{ inputs.force_matrix || 'false' }}
        run: |
          set -u
          out=$(bash scripts/should-run-matrix.sh)
          echo "$out"
          run=$(echo "$out" | grep -oP '^run=\K(true|false)' | head -1)
          reason=$(echo "$out" | grep -oP '^reason=\K.*' | head -1)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "### 故障注入矩阵：$([ "$run" = "true" ] && echo 执行 || echo 跳过)" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"

      - name: 63 格故障注入矩阵
        if: steps.matrix-gate.outputs.run == 'true'
        shell: bash
        run: bash scripts/matrix-test.sh

      # 跳过时显式留痕：跳过不等于通过，不能让它看起来像跑过了。
      - name: 矩阵已跳过（不代表通过）
        if: steps.matrix-gate.outputs.run != 'true'
        shell: bash
        run: |
          echo "::notice::本次未运行 63 格故障注入矩阵——改动不涉及检测力。"
          echo "这不等于「矩阵通过」：检测力在本提交上未经校验。"
          echo "需要校验时在 Actions 页手动触发并勾选 force_matrix。"

